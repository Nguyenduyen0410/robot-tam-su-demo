<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563EB" />
  <meta name="description" content="Myka Care Companion — ứng dụng dành cho người thân theo dõi sức khỏe và lịch chăm sóc." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="myka-icon.svg" type="image/svg+xml" />
  <!-- Google Fonts Material Symbols (rounded); free icon family listed on Figma Community. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet" />
  <title>Myka Care Companion</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2563EB',
            'primary-dark': '#1d4ed8',
          }
        }
      }
    }
  </script>

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Recharts -->
  <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8fafc; }
    .elder-text { font-size: 1.25rem !important; line-height: 1.75rem !important; }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239,68,68,0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(239,68,68,0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239,68,68,0); }
    }
    .sos-pulse { animation: pulse-ring 1.5s infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease; }
    .sidebar-link { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 8px; cursor: pointer; transition: background 0.15s; color: #374151; text-decoration: none; }
    .sidebar-link:hover { background: #eff6ff; color: #1d4ed8; }
    .sidebar-link.active { background: #1d4ed8; color: white; }
    .chat-bubble-user { background: #1d4ed8; color: white; border-radius: 18px 18px 4px 18px; }
    .chat-bubble-robot { background: #f1f5f9; color: #1e293b; border-radius: 18px 18px 18px 4px; }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: #f1f5f9; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    input, select, textarea { outline: none; }
    input:focus, select:focus, textarea:focus { ring: 2px solid #2563EB; }
    .status-badge-normal { background: #dcfce7; color: #166534; }
    .status-badge-warning { background: #fef9c3; color: #854d0e; }
    .status-badge-critical { background: #fee2e2; color: #991b1b; }
    .bp-normal { color: #16a34a; }
    .bp-warning { color: #d97706; }
    .bp-critical { color: #dc2626; }
    .material-symbols-rounded { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 30px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- On localhost, use the development API. Set MYKA_API_BASE to the deployed API URL for production. -->
  <script src="api-config.js"></script>

  <!-- 1. Data & helpers -->
  <script type="text/babel" src="data.js"></script>

  <!-- Myka Care Companion is the family-facing app. -->
  <script type="text/babel" src="pages/landing.js"></script>
  <script type="text/babel" src="pages/login.js"></script>
  <script type="text/babel" src="pages/family.js"></script>
  <script type="text/babel" src="components/device-setup.js"></script>
  <script type="text/babel" src="components/schedule-editor.js"></script>
  <script type="text/babel" src="components/conversation-history.js"></script>
  <script type="text/babel" src="components/dnd-duration-picker.js"></script>
  <script type="text/babel" src="components/payment-checkout.js"></script>
  <script type="text/babel" src="components/wifi-network-picker.js"></script>

  <!-- App (last) -->
  <script type="text/babel" src="app.js"></script>
</body>
</html>
