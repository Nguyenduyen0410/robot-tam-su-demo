name: Tạo số đo huyết áp mô phỏng theo lịch

on:
  schedule:
    # Kiểm tra lại để không bỏ lượt khi GitHub khởi động trễ.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myka-scheduled-demo-bp
  cancel-in-progress: false

jobs:
  sync-demo-reading:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Gửi các khung giờ đã đến, backend chống ghi trùng
        shell: bash
        run: |
          for slot in morning evening; do
            curl --fail-with-body --silent --show-error --max-time 30 --retry 3 --retry-delay 5 \
              -X POST \
              -H 'Origin: https://myka-care-companion.pages.dev' \
              "https://myka-care-companion.pages.dev/api/demo-scheduler/tick/E001?slot=${slot}"
            echo
          done
